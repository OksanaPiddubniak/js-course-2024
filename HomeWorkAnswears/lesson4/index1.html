<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <link href="styles.css" rel="stylesheet" />
    <style>
      .wrapper {
        display: flex;
        margin: 0 auto;
        justify-content: center;
        align-items: center;
        padding: 20px 0;
        gap: 20px;
      }
      .block {
        width: 200px;
        height: 200px;
        border: 1px solid lavender;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-family: sans-serif;
        transition: background-color 0.5s ease;
        color: lightseagreen;
      }
      .block:hover,
      .clean-results:hover {
        background-color: lightseagreen;
        color: #fff;
      }
      .round__wrapper,
      .wins,
      .clean-results {
        display: block;
        margin: 0 auto;
        background: transparent;
        padding: 20px 30px;
        color: lightseagreen;
        border: 1px solid lavender;
        font-size: 15px;
        width: 185px;
        font-family: sans-serif;
        text-align: center;
      }
      .wins,
      .clean-results {
        margin-top: 20px;
      }
      .clean-results {
        transition: background-color 0.5s ease;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="block">Камінь</div>
      <div class="block">Ножиці</div>
      <div class="block">Папір</div>
    </div>
    <div class="round__wrapper">
      <p>Раунд :</p>
      <div class="round"></div>
    </div>
    <div class="wins">
      <p>Кількість перемог компьютера:</p>
      <div class="computer_wins"></div>
    </div>
    <div class="wins">
      <p>Кількість перемог користувача:</p>
      <div class="user_wins"></div>
    </div>
    <button class="clean-results">Очистити результат</button>
    <script src="main.js"></script>
  </body>
</html>
